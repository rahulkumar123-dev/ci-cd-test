name: CI/CD Pipeline

# Trigger workflow on push to main branch or pull request
on:
  push:
    branches: [ "test-branch" ]
  pull_request:
    branches: [ "test-branch" ]

jobs:
  build-test-deploy:
    runs-on: [self-hosted]

    steps:
      # Step 1: Checkout repo code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step-2 : install python
      - name: install python
        run: yum install python3 -y

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Optional debug - check installed packages
      - name: Check Python environment
        run: |
          python --version
          pip list

      # Step 5: Run tests using pytest
      - name: Run tests
        run: python -m pytest
